name: incident-integrity

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read
  issues: read
  pull-requests: read

jobs:
  validate-incidents:
    runs-on: ubuntu-latest
    steps:
      - name: Check out exact workflow subject
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          fetch-depth: 2
          persist-credentials: false
      - name: Set up Python
        uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065
        with:
          python-version: "3.12"
      - name: Validate durable incident reports
        run: python scripts/validate_incidents.py
      - name: Validate live GitHub lifecycle
        env:
          GITHUB_TOKEN: ${{ github.token }}
          GITHUB_REPOSITORY: ${{ github.repository }}
        run: python scripts/validate_incidents.py --live
      - name: Reject whitespace errors
        run: git diff --check HEAD^ HEAD
